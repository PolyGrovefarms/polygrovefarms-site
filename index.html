
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polygrove Farms</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; text-align: center; background: #f4f6f4; color: #2d3748; padding: 2rem 1rem; margin: 0; }
    .logo { max-width: 200px; height: auto; border-radius: 8px; margin-bottom: 1rem; }
    .card { background: white; padding: 1.5rem; margin: 1rem auto; max-width: 400px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: left; }
    .card h3 { margin-top: 0; color: #2f855a; }
    .price { font-weight: bold; color: #2d3748; font-size: 1.1rem; }
  </style>
</head>
<body>

  <img src="54958CC1-75D7-4217-B096-F71082434914.png" alt="Polygrove Farms Logo" class="logo">

  <h1>Polygrove Farms</h1>
  <p>Fresh Pasture-Raised Eggs & Local Goods</p>

  <div class="card">
    <h3>Fresh Eating Eggs</h3>
    <p>Farm-fresh pasture-raised chicken eggs.</p>
    <div class="price">$5.00 / dozen</div>
  </div>

  <div class="card">
    <h3>Duck Eggs</h3>
    <p>Rich, fresh pasture-raised duck eggs.</p>
    <div class="price">$8.00 / dozen</div>
  </div>

</body>
</html>
